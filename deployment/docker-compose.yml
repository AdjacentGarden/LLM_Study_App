services:
  api:
    build: ../backend
    env_file: ../.env
    ports:
      - "8100:8100"
    volumes:
      - ${DATA_DISK_ROOT:-/data/adaptive-book-learning}/app-data:/app/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: adaptive_learning
      POSTGRES_USER: adaptive_learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deployment secret}
    volumes:
      - ${DATA_DISK_ROOT:-/data/adaptive-book-learning}/postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DISK_ROOT:-/data/adaptive-book-learning}/redis:/data

  mineru:
    image: mineru:local-gpu
    profiles: ["gpu"]
    volumes:
      - ${DATA_DISK_ROOT:-/data/adaptive-book-learning}/app-data:/data
      - ${DATA_DISK_ROOT:-/data/adaptive-book-learning}/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
