[program:cloudpath-layout]
command=/bin/bash /root/autodl-tmp/adaptive-book-ocr/ops/run-layout-service.sh
directory=/root/autodl-tmp/adaptive-book-ocr
autostart=true
autorestart=true
startsecs=15
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/adaptive-book-ocr/logs/layout-service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
