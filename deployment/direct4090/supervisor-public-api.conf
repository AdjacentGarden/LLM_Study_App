[program:cloudpath-public-api]
command=/root/autodl-tmp/adaptive-book-ocr/.venv-api/bin/python -m uvicorn public_api_proxy:app --app-dir /root/autodl-tmp/adaptive-book-ocr/ops --host 0.0.0.0 --port 6008 --no-access-log --timeout-keep-alive 15
directory=/root/autodl-tmp/adaptive-book-ocr
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/adaptive-book-ocr/logs/public-api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
